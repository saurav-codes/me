      :root {
        --ink: #111;
        --ink-soft: #555;

        --sans: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
        --serif: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
      }
      :root[data-theme="dark"] {
        --ink: #ededed;
        --ink-soft: #aaa;
        --ink-faint: #777;
        --ink-shade: #ccc;
        --paper: #101010;
        --paper-ink: #fff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: var(--sans);
        color: var(--ink);
        background: var(--paper);
        line-height: 1.6;

      a {

        text-decoration: underline;

      header nav a .ph {
        font-size: 13px;
        margin-right: 5px;
        vertical-align: -1px;
      }
      a[target="_blank"]::after {
        content: "\2197";
        font-size: 0.72em;
        margin-left: 3px;
        display: inline-block;
        transition: transform 150ms ease-out;
      }
      a[target="_blank"]:hover::after {
        transform: translate(2px, -2px);
      }
      h1 .ph {
        font-size: 26px;
        vertical-align: -2px;
      }
      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
        border-radius: 2px;
      }
      .container {

        text-decoration: none;
        margin-left: 36px;
      }
      header nav a:hover {

        text-decoration: underline;
        text-underline-offset: 20px;
      }
      #theme-toggle {
        margin-left: 36px;
        background: none;
        border: none;
        cursor: pointer;
        color: var(--ink-soft);
        font-size: 17px;
        display: inline-flex;
        padding: 0;
      }
      #theme-toggle:hover {
        color: var(--ink);
      }
      #theme-toggle .ph {
        display: block;
      }

      h1 {
        font-family: var(--serif);
        font-size: 30px;
        font-weight: 400;
        letter-spacing: -0.01em;
        margin-bottom: 8px;
      }
      .lead {
        font-size: 15px;
        color: var(--ink-soft);
        margin-bottom: 56px;
      }

      .photo-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 20px;
      }
      .gallery-item {
        display: block;
        text-decoration: none;
        color: inherit;
      }
      .gallery-item img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 2px;
        display: block;
        cursor: zoom-in;
        outline: 1px solid oklch(0 0 0 / 0.1);
      }
      :root[data-theme="dark"] .gallery-item img {
        outline: 1px solid oklch(1 0 0 / 0.1);
      }
      .gallery-item .caption {
        font-size: 12px;
        color: var(--ink-faint);
        padding: 6px 0 0;
        display: block;
      }
      .is-hidden {

      }

        font-size: 14px;

        color: var(--ink-soft);
        background: none;
        border: 1px solid var(--ink-faint);
        border-radius: 2px;
        padding: 8px 16px;
        cursor: pointer;
      }
      .load-more:hover {
        color: var(--ink);
        border-color: var(--ink);
      }

      .lightbox {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: color-mix(in srgb, var(--paper) 92%, transparent);
        z-index: 30;
      }
      .lightbox-content {
        max-width: 80vw;
        max-height: 84vh;
      }
      .lightbox-content img {

        max-height: 80vh;
        object-fit: contain;
        border-radius: 2px;
      }
      .lightbox-caption {
        text-align: center;
        font-size: 13px;
        color: var(--ink-soft);
        margin-top: 10px;
      }
      .lightbox-close,

        background: none;
        border: none;
        color: var(--ink);

        cursor: pointer;

    <script>
      (function () {
        const items = Array.from(document.querySelectorAll(".gallery-item"));
        const loadMore = document.getElementById("gallery-load-more");
        let visible = 6;
        const images = items.map((i) => i.querySelector("img"));

        function update() {
          items.forEach((item, i) => item.classList.toggle("is-hidden", i >= visible));
          if (loadMore) loadMore.hidden = visible >= items.length;
        }
        update();

        if (loadMore) {
          loadMore.addEventListener("click", () => {
            visible = Math.min(visible + 6, items.length);
            update();
          });
        }

        const lightbox = document.createElement("div");
        lightbox.className = "lightbox";
        const content = document.createElement("div");
        content.className = "lightbox-content";
        const closeBtn = document.createElement("button");
        closeBtn.type = "button";
        closeBtn.className = "lightbox-close";
        closeBtn.setAttribute("aria-label", "Close");
        closeBtn.innerHTML = '<i class="ph ph-x" aria-hidden="true"></i>';
        const prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.className = "lightbox-nav lightbox-prev";
        prevBtn.setAttribute("aria-label", "Previous");
        prevBtn.innerHTML = '<i class="ph ph-caret-left" aria-hidden="true"></i>';
        const nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.className = "lightbox-nav lightbox-next";
        nextBtn.setAttribute("aria-label", "Next");
        nextBtn.innerHTML = '<i class="ph ph-caret-right" aria-hidden="true"></i>';

        lightbox.appendChild(content);
        lightbox.appendChild(closeBtn);
        lightbox.appendChild(prevBtn);
        lightbox.appendChild(nextBtn);
        document.body.appendChild(lightbox);

        let current = 0;

        function show(index) {
          current = index;
          const image = images[index];
          const caption = image.closest(".gallery-item").querySelector(".caption").innerHTML;
          content.innerHTML = '<img src="' + image.src + '" alt="' + image.alt + '"><div class="lightbox-caption">' + caption + "</div>";
          prevBtn.style.display = index === 0 ? "none" : "";
          nextBtn.style.display = index === images.length - 1 ? "none" : "";
        }
        function close() {
          lightbox.style.display = "none";
          document.body.style.overflow = "";
        }

        images.forEach((image, index) => {
          image.addEventListener("click", () => {
            lightbox.style.display = "flex";
            document.body.style.overflow = "hidden";
            show(index);
          });
        });
        closeBtn.addEventListener("click", close);
        prevBtn.addEventListener("click", () => {
          if (current > 0) show(current - 1);
        });
        nextBtn.addEventListener("click", () => {
          if (current < images.length - 1) show(current + 1);
        });
        lightbox.addEventListener("click", (event) => {
          if (event.target === lightbox) close();
        });
        document.addEventListener("keydown", (event) => {
          if (lightbox.style.display !== "flex") return;
          if (event.key === "Escape") close();
          else if (event.key === "ArrowLeft" && current > 0) show(current - 1);
          else if (event.key === "ArrowRight" && current < images.length - 1) show(current + 1);
        });
      })();
    </script>
